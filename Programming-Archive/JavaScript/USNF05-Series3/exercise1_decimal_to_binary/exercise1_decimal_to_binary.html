<!DOCTYPE html>
<html>
<head>
    <title>Exercise 1 - Decimal to Binary</title>
</head>
<body>
    <h2>Exercise 1 - Decimal to Binary</h2>

    <script>
    // Exercise 1 (USNF05 - Series 3)
    // Ask the user for a positive integer and convert it to binary.
    //
    // Method (the one given in the exercise sheet):
    //   - divide N by 2 (integer division), keep the remainder
    //   - divide the quotient by 2 again, keep the remainder
    //   - repeat until the quotient is 0
    //   - the binary number is the remainders read from bottom to top
    //
    // Example: N = 14
    //   14 / 2 = 7  remainder 0
    //    7 / 2 = 3  remainder 1
    //    3 / 2 = 1  remainder 1
    //    1 / 2 = 0  remainder 1
    //   -> 14 (base 10) = 1110 (base 2)

    let val = prompt("Enter a positive integer");
    let n = Number(val);

    // we only accept a real positive integer
    if (isNaN(n) || n != parseInt(n) || n <= 0) {
        alert(val + " is not a positive integer");
    }
    else {
        let binary = "";     // we will build the binary string here
        let q = n;           // q is the current quotient, we start at n

        while (q > 0) {
            let r = q % 2;            // remainder of the division by 2
            binary = r + binary;      // we put the remainder on the LEFT
            q = parseInt(q / 2);      // next quotient (integer division)
        }

        alert(n + " (base 10) = " + binary + " (base 2)");
    }
    </script>
</body>
</html>
