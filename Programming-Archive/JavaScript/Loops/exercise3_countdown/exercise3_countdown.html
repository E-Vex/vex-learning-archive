    <title>Exercise 3 - Countdown</title>
</head>
<body>
    <h2>Exercise 3 - Countdown</h2>
    <p>Open the browser console (F12) to see the output.</p>

    <script>
    // Exercise 3: countdown, print the numbers from 10 down to 1

    let i = 10;
    while (i >= 1) {
        console.log(i);
        i--;
    }
    </script>
