<!DOCTYPE html>
<html>
<head>
    <title>Exercise 6 - Password</title>
</head>
<body>
    <h2>Exercise 6 - Password</h2>

    <script>
    // Exercise 6: ask for the password until the user enters "1234"
    // do...while is used because we must ask at least one time

    let password;

    do {
        password = prompt("Enter the password");
    } while (password !== "1234");

    alert("Correct password!");
    </script>
</body>
</html>
