<!DOCTYPE html>
<html>
<head>
    <title>Exercise 4 - Sum 1 to 100</title>
</head>
<body>
    <h2>Exercise 4 - Sum 1 to 100</h2>
    <p>Open the browser console (F12) to see the output.</p>

    <script>
    // Exercise 4: calculate the sum of the numbers from 1 to 100
    // expected result: 5050

    let i = 1;
    let sum = 0;

    while (i <= 100) {
        sum = sum + i;   // add the current number to the sum
        i++;
    }

    console.log("Sum =", sum);
    </script>
</body>
</html>
