<!DOCTYPE html>
<html>
<head>
    <title>Exercise 5 - Multiplication Table</title>
</head>
<body>
    <h2>Exercise 5 - Multiplication Table</h2>
    <p>Open the browser console (F12) to see the table.</p>

    <script>
    // Exercise 5: ask for a number and display its
    // multiplication table from 1 to 10

    let number = Number(prompt("Enter a number"));

    let i = 1;
    while (i <= 10) {
        console.log(number + " x " + i + " = " + (number * i));
        i++;
    }
    </script>
</body>
</html>
