<!DOCTYPE html>
<html>
<head>
    <title>Exercise 2 - Even Numbers 2 to 20</title>
</head>
<body>
    <h2>Exercise 2 - Even Numbers 2 to 20</h2>
    <p>Open the browser console (F12) to see the output.</p>

    <script>
    // Exercise 2: print the even numbers from 2 to 20 with a while loop
    // we start at 2 and add 2 each time to stay on the even numbers

    let i = 2;
    while (i <= 20) {
        console.log(i);
        i += 2;
    }
    </script>
</body>
</html>
