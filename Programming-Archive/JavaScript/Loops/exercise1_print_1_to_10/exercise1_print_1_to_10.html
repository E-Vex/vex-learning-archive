<!DOCTYPE html>
<html>
<head>
    <title>Exercise 1 - Print Numbers 1 to 10</title>
</head>
<body>
    <h2>Exercise 1 - Print Numbers 1 to 10</h2>
    <p>Open the browser console (F12) to see the output.</p>

    <script>
    // Exercise 1: print the numbers from 1 to 10 with a while loop

    let i = 1;
    while (i <= 10) {
        console.log(i);
        i++;
    }
    </script>
</body>
